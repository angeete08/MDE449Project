[project]
name = "feature-ai-coach"
version = "0.1.0"
description = "Stride coach: manual preferences and optional private photo previews"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.21"

[dependencies]
Pillow = ">=11.3,<13"
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[client]

[client.vite.server]
host = "127.0.0.1"

[client.app_meta_data]
title = "Stride · Coach lab"

[serve]
host = "127.0.0.1"
port = 8400
cors_origins = ["http://localhost:8400", "http://127.0.0.1:8400"]
graph_enabled = false

[serve.limits]
max_body_bytes = 14000000

[test]
directory = "."
filter = "*tests.jac"
